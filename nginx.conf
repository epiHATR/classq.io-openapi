server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html application/javascript text/yaml application/yaml;

    location = /openapi.yaml {
        default_type application/yaml;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
