components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login, Google sign-in, or refresh.
  parameters:
    page:
      name: page
      in: query
      required: false
      description: 1-based page. Default depends on the handler.
      schema:
        type: integer
    pageSize:
      name: page_size
      in: query
      required: false
      description: Page size. Handlers cap this (often 500 for quiz lists).
      schema:
        type: integer
    q:
      name: q
      in: query
      required: false
      description: Search text.
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      description: Sort field.
      schema:
        type: string
    order:
      name: order
      in: query
      required: false
      description: Sort direction.
      schema:
        type: string
    category_id:
      name: category_id
      in: query
      required: false
      description: Single category id filter.
      schema:
        type: string
    category_ids:
      name: category_ids
      in: query
      required: false
      description: Comma-separated category ids. Overrides category_id.
      schema:
        type: string
    level:
      name: level
      in: query
      required: false
      description: Single question level filter.
      schema:
        type: integer
    levels:
      name: levels
      in: query
      required: false
      description: Comma-separated levels. Overrides level.
      schema:
        type: string
    access_type:
      name: access_type
      in: query
      required: false
      description: Question access filter.
      schema:
        type: string
    access_modes:
      name: access_modes
      in: query
      required: false
      description: Comma-separated access modes such as practice,cert. Overrides access_type.
      schema:
        type: string
    status:
      name: status
      in: query
      required: false
      description: Status filter.
      schema:
        type: string
    fresh:
      name: fresh
      in: query
      required: false
      description: Bypass cached category names when true (1, true, yes, on).
      schema:
        type: boolean
    prioritize_ids:
      name: prioritize_ids
      in: query
      required: false
      description: Comma-separated ids to sort first.
      schema:
        type: string
    exclude_ids:
      name: exclude_ids
      in: query
      required: false
      description: Comma-separated ids to exclude.
      schema:
        type: string
    kind:
      name: kind
      in: query
      required: false
      description: 'Session entry kind: individual or group.'
      schema:
        type: string
    result:
      name: result
      in: query
      required: false
      description: 'Session result filter: passed, failed, or pending.'
      schema:
        type: string
    exam_id:
      name: exam_id
      in: query
      required: false
      description: Limit sessions to one exam.
      schema:
        type: string
    flat:
      name: flat
      in: query
      required: false
      description: Return per-user session rows instead of batch entries.
      schema:
        type: boolean
    ids_only:
      name: ids_only
      in: query
      required: false
      description: Pass 1 to return ids only.
      schema:
        type: string
    manual:
      name: manual
      in: query
      required: false
