openapi: 3.1.0
info:
  title: ClassQ.io API
  version: 1.1.9
  description: 'HTTP API for ClassQ.io, an online testing and certification platform. Route registration
    lives in classqIO `backend/cmd/server/main.go`. Plugin sidecar traffic is proxied at `/api/plugins/{pluginID}`
    when the pack is available and enabled. The shipped callsign pack is reached through that proxy; its
    sidecar listens on its own port and is not a second public host.


    Send `Authorization: Bearer <jwt>` on every operation that does not set `security: []`. Errors use
    `{ "error": "message" }`.


    Learner exam state from `GET /api/me/sessions/{sessionID}/exam` must not include `is_correct` on answer
    options. Correctness during an attempt is only returned by `POST /api/me/sessions/{sessionID}/answers/reveal`.


    JSON response schemas use `JsonObject` where the handler payload is a large domain document. Request
    bodies match the Go structs decoded by those handlers. When a feature adds or changes an endpoint,
    update this file in the same change.'
servers:
- url: http://127.0.0.1:8080
  description: Local API (go run ./cmd/server)
- url: http://127.0.0.1:5173
  description: Vite dev server, which proxies /api to the API
tags:
- name: Health
  description: Liveness of the API process and Redis.
- name: Setup
  description: First-time setup administrator bootstrap.
- name: Auth
  description: Sign-in, registration, refresh, and the current user.
- name: Profile
  description: Account profile, avatar, password, MFA, and deletion.
- name: Admin
  description: Roles, users, settings, mail, backups, and system tools.
- name: Documents
  description: Shared document library.
- name: Enrollments
  description: Self-enroll, catalogs, invites, and level suggestion.
- name: News
  description: Published news and the learner news list.
- name: Exam session
  description: 'Timed attempt: start, answers, reveal, submit.'
- name: Notifications
  description: In-app notifications for the signed-in user.
- name: Jobs
  description: Background job status for the signed-in user.
- name: Plugins
  description: Plugin catalog and reverse proxy to sidecar packs.
- name: Callsign
  description: Shipped callsign pack, reached through the plugin proxy.
- name: Mailbox
  description: Contact form and user mailbox.
- name: Media
  description: Media library bytes and uploads.
- name: Certification check
  description: Authenticated public certificate lookup.
- name: Content
  description: Quiz authoring for content.manage.
- name: Sessions
  description: Content-manager session grants, resets, and exports.
- name: Certificates
  description: Grant, revoke, and export certificates.
security:
- bearerAuth: []
